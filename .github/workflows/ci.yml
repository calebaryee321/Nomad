name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /home/runner/work/Nomad/Nomad/apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -e .[dev]
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Test (pytest)
        run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /home/runner/work/Nomad/Nomad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install workspace dependencies
        run: npm install
      - name: Mobile lint
        run: npm run --workspace @nomad/mobile lint
      - name: Mobile tests
        run: npm run --workspace @nomad/mobile test
