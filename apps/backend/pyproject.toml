[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-backend"
version = "0.1.0"
description = "Nomad backend API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.31.0"
]

[project.optional-dependencies]
dev = [
  "black>=24.8.0",
  "httpx>=0.27.2",
  "pytest>=8.3.0",
  "ruff>=0.6.8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
