services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nomad
      POSTGRES_USER: nomad
      POSTGRES_PASSWORD: nomad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
